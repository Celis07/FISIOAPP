<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />

    <!-- PWA / Theme -->
    <meta name="theme-color" content="#26a69a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FisioApp" />

    <!-- SEO -->
    <meta name="description" content="Tu plataforma personal de fisioterapia. Sigue tu plan de ejercicios, mide tu progreso y comunícate con tu fisioterapeuta." />
    <meta name="robots" content="noindex" />

    <!-- Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Splash screen colors for iOS -->
    <meta name="msapplication-TileColor" content="#0b0e1a" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <title>FisioApp</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />

    <style>
      :root {
        --bg: #0b0e1a;
        --surface: #111827;
        --card: #1a2035;
        --border: #263050;
        --accent: #26a69a;
        --text: #e8edf5;
        --muted: #7c8db5;
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
      }

      * {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }

      html, body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        overscroll-behavior: none;
        min-height: 100vh;
        min-height: -webkit-fill-available;
      }

      /* Scrollbars */
      ::-webkit-scrollbar { width: 3px; height: 3px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

      /* Form elements */
      input, textarea, select {
        color: var(--text) !important;
        -webkit-appearance: none;
        appearance: none;
      }
      input::placeholder, textarea::placeholder { color: #3d4f7c !important; }
      input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.6); }

      /* Smooth scrolling */
      .scroll-smooth { scroll-behavior: smooth; }

      /* Active states for touch */
      button:active { opacity: 0.75; transform: scale(0.97); }
      
      /* Prevent text selection on UI elements */
      button, nav { user-select: none; -webkit-user-select: none; }

      /* Full height on mobile */
      #root { min-height: 100vh; min-height: -webkit-fill-available; }

      /* Animations */
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
      @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
      @keyframes checkmark { 0% { transform: scale(0); } 60% { transform: scale(1.2); } 100% { transform: scale(1); } }

      .fade-in { animation: fadeIn 0.25s ease; }
      .slide-up { animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
      .checkmark-anim { animation: checkmark 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register service worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(reg => {
              console.log('FisioApp SW registered:', reg.scope);
            })
            .catch(err => console.warn('SW registration failed:', err));
        });
      }

      // Prevent zoom on double tap (iOS)
      let lastTouchEnd = 0;
      document.addEventListener('touchend', function(e) {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });
    </script>
  </body>
</html>
